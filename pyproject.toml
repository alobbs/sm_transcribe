[project]
name = "sm_transcribe"
version = "1.0.0"
description = "Download and transcribe TikTok/Instagram videos locally"
license = "MIT"
authors = [
    { name = "Alvaro Lopez Ortega", email = "alvaro@alobbs.com" }
]
requires-python = ">=3.10"
keywords = ["tiktok", "instagram", "transcribe", "whisper", "subtitles", "srt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/alobbs/sm_transcribe"

[project.scripts]
sm_transcribe = "sm_transcribe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "sm_transcribe.py",
    "transcriber/",
]

[tool.hatch.build.targets.sdist]
include = [
    "sm_transcribe.py",
    "transcriber/",
    "LICENSE",
    "pyproject.toml",
]
